<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Mendeleev's Periodic Table</title>
</head>
<body>
  <header>
    <h1>Mendeleev's Periodic Table of Elements</h1>
    <h2>This is the standard layout of the periodic table.</h2>
  </header>
  <main>
    <div class="table-container">
      <div class="element-grid">
        <div class="element-block">
          <p class="element-number">1</p>
          <p class="element-symbol">H</p>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
